 const prev=pointers.get(e.pointerId),dx=e.clientX-prev.x,dy=e.clientY-prev.y;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){
  if(e.buttons===2 || e.shiftKey){
   const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
   const front=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
   const scale=distance*.00145;
   target.addScaledVector(right,-dx*scale);target.addScaledVector(front,dy*scale);
  }else{
   azVel=dx*.0065;poVel=dy*.0056;
   azimuth-=azVel;polar-=poVel;
  }
 }else if(pointers.size===2){
   const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
   const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
   if(lastTouchDistance>0){distance*=lastTouchDistance/dist;}
   if(lastTouchMid){
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    const scale=distance*.0015;
    target.addScaledVector(right,-(mx-lastTouchMid.x)*scale);
    target.addScaledVector(up,(my-lastTouchMid.y)*scale);
   }
   lastTouchDistance=dist;lastTouchMid={x:mx,y:my};

const clock=new THREE.Clock();
function render(){
 requestAnimationFrame(render);
 const t=clock.getElapsedTime();
 const cycle=(t%15.5),open=cycle<2?0:cycle<3.4?(cycle-2)/1.4:cycle<6.5?1:cycle<7.9?1-(cycle-6.5)/1.4:0;
 for(const d of doors)d.door.position.x=d.base+d.dir*open*.67;
 // Very restrained intermittent sign and store light fluctuations.
 const pulse=1-.035*Math.sin(t*.72)-(.055*(Math.sin(t*15)>0.995?1:0));
 signPanel.material.opacity=pulse;signPanel.material.transparent=true;
 signHalo.intensity=6.1*pulse;
 if(Math.floor(t/6)%2===0){traffic[0].opacity=.92;traffic[2].opacity=.13}else{traffic[0].opacity=.12;traffic[2].opacity=.96}
 // Update rain in world coordinates; drops fall continuously behind and in front of the store.
 for(let i=0;i<rainCount;i++){
   const s=seeds[i],off=i*6;
   const yy=((s.y-t*s.speed)%8.25+8.25)%8.25;
   const xx=s.x-((t*.12*s.drift)%1.5);
   rainPositions[off]=xx;rainPositions[off+1]=yy;rainPositions[off+2]=s.z;
   rainPositions[off+3]=xx+.095;rainPositions[off+4]=yy-s.len;rainPositions[off+5]=s.z+.027;
 }
 rainGeo.attributes.position.needsUpdate=true;
 for(const s of streaks){s.o.position.y=.85+((s.base-t*s.speed)%2.8+2.8)%2.8;}
 for(const d of drips){const u=(t*d.speed+d.phase)%3.7;d.obj.position.y=3.36-u*.75;d.obj.material.opacity=u<3.4?.42:0;}
 for(const r of ripples){let u=(t*.62+r.phase)%3.7/3.7;r.mesh.scale.setScalar(.05+u*.57);r.mesh.material.opacity=.23*Math.sin(Math.PI*u);}
 if(pointers.size===0){
  azimuth-=azVel*.25;polar-=poVel*.25;
  azVel*=.81;poVel*=.81;
 }
 positionCamera();renderer.render(scene,camera);
}
render();
</script>
